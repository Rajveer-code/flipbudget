[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipbudget"
version = "0.1.0"
description = "Scorer-induced partial identification of benchmark comparisons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rajveer Singh Pall" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flipbudget = "flipbudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
